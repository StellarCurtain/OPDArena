[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opdarena"
version = "0.1.0"
description = "Training and evaluation for learning and forgetting in on-policy distillation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "build>=1.2"]

[project.scripts]
opdarena-train = "opdarena.train:main"
opdarena-evaluate = "opdarena.evaluate:main"

[tool.setuptools.packages.find]
include = ["opdarena*"]

[tool.setuptools.package-data]
"opdarena.evaluation" = ["ood_tasks/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
