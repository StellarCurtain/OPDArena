name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c requirements/constraints-cu128.txt 'numpy==1.26.4' safetensors -e '.[dev]'
      - run: python -m pytest -q
      - run: ruff check opdarena tests scripts
      - run: ruff format --check opdarena tests scripts
      - run: python scripts/check_release.py
